name: Build Minecraft Mods

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Build ${{ matrix.mod }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        mod:
          - ultimateores

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        run: |
          curl -L https://services.gradle.org/distributions/gradle-8.4-bin.zip -o gradle.zip
          unzip -q gradle.zip
          echo "$PWD/gradle-8.4/bin" >> "$GITHUB_PATH"

      - name: Build ${{ matrix.mod }}
        working-directory: mods/${{ matrix.mod }}
        run: gradle build --no-daemon

      - name: Upload ${{ matrix.mod }} JAR
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.mod }}-jar
          path: mods/${{ matrix.mod }}/build/libs/*.jar
