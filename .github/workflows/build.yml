name: Build mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Download Forge MDK and build
        run: |
          curl -L -o mdk.zip https://maven.minecraftforge.net/net/minecraftforge/forge/1.20.1-47.3.0/forge-1.20.1-47.3.0-mdk.zip
          mkdir mdk
          unzip -q mdk.zip -d mdk
          cd mdk
          if [ ! -f gradlew ]; then cd */; fi
          rm -rf src
          cp -r "$GITHUB_WORKSPACE/src" ./src
          sed -i 's/^mod_id=.*/mod_id=saoswords/' gradle.properties
          chmod +x gradlew
          ./gradlew build --no-daemon
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp build/libs/*.jar "$GITHUB_WORKSPACE/out/"

      - uses: actions/upload-artifact@v4
        with:
          name: saoswords-jar
          path: out/*.jar
